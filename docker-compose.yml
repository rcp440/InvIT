version: "3.9"

services:

  # ── Aplicación Node.js ──────────────────────────────────────────
  app:
    build:
      context: .
      target: runtime
    container_name: inventarioit_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV:               ${NODE_ENV:-production}
      PORT:                   3000
      DB_HOST:                db
      DB_PORT:                5432
      DB_NAME:                ${DB_NAME:-inventario_it}
      DB_USER:                ${DB_USER:-inventario_user}
      DB_PASSWORD:            ${DB_PASSWORD}
      DB_SSL:                 "false"
      JWT_SECRET:             ${JWT_SECRET}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS:     ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN:            ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL:              ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX:    ${AUTH_RATE_LIMIT_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    networks:
      - inventarioit_net

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: inventarioit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-inventario_it}
      POSTGRES_USER:     ${DB_USER:-inventario_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventario_user} -d ${DB_NAME:-inventario_it}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - inventarioit_net
    ports:
      - "${DB_EXPOSE_PORT:-5433}:5432"   # expuesto en puerto distinto para no chocar con PG local

  # ── Nginx reverse proxy (opcional, comentar si no se usa) ───────
  # nginx:
  #   image: nginx:alpine
  #   container_name: inventarioit_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - inventarioit_net

volumes:
  db_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local

networks:
  inventarioit_net:
    driver: bridge
