# /etc/nginx/sites-available/inventarioit
# Copia este archivo en el servidor y luego:
#   sudo ln -s /etc/nginx/sites-available/inventarioit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream inventarioit_app {
    # Si PM2 corre en modo cluster con N instancias, Nginx las balancea por round-robin
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # Cambia por tu dominio o IP pública: server_name tu-dominio.com;

    # Tamaño máximo de upload (debe coincidir con UPLOAD_MAX_SIZE_MB)
    client_max_body_size 10M;

    # Seguridad básica
    server_tokens off;
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "same-origin"  always;

    # Logs
    access_log /var/log/nginx/inventarioit_access.log;
    error_log  /var/log/nginx/inventarioit_error.log;

    # Archivos estáticos servidos directo por Nginx (más eficiente que Node)
    location /uploads/ {
        alias /opt/inventarioit/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /opt/inventarioit/public;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @node;
    }

    # Todo lo demás va a Node.js
    location / {
        proxy_pass         http://inventarioit_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;         # 5s más que el connect-timeout de la app
        proxy_send_timeout 35s;
        proxy_buffering    off;
    }

    location @node {
        proxy_pass http://inventarioit_app;
    }

    # Bloquear acceso a archivos sensibles
    location ~ /\. {
        deny all;
    }
}

