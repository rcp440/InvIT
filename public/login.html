<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarioIT — Acceso</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --brand: #1e3a5f;
      --brand-light: #2d5a8e;
      --accent: #0ea5e9;
    }
    body {
      background: linear-gradient(135deg, var(--brand) 0%, #0f2340 60%, #162d4a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,.35);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      color: #fff;
    }
    .login-header .logo-icon {
      width: 64px; height: 64px;
      background: rgba(255,255,255,.15);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.8rem;
    }
    .login-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .login-header p  { font-size: .85rem; opacity: .75; margin: .25rem 0 0; }
    .login-body { padding: 2rem; }
    .form-floating label { color: #6c757d; font-size: .9rem; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(14,165,233,.2); }
    .btn-login {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      border: none; color: #fff; font-weight: 600;
      padding: .75rem; font-size: 1rem;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }
    .btn-login:disabled { opacity: .6; }
    .alert-login { font-size: .875rem; border-radius: 8px; }
    .login-footer { text-align: center; padding: 1rem 2rem 1.5rem; color: #adb5bd; font-size: .78rem; }
    #spinner { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
      <h1>InventarioIT</h1>
      <p>Sistema de inventario profesional</p>
    </div>

    <div class="login-body">
      <div id="alertLogin" class="alert alert-danger alert-login d-none" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span id="alertMsg"></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="email@empresa.com"
                 autocomplete="username" required>
          <label for="email"><i class="fa-regular fa-envelope me-1"></i>Email</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="password" placeholder="Password"
                 autocomplete="current-password" required>
          <label for="password"><i class="fa-solid fa-lock me-1"></i>Contraseña</label>
        </div>
        <button type="submit" class="btn btn-login w-100 rounded-3" id="btnLogin">
          <span id="spinner" class="spinner-border spinner-border-sm me-2"></span>
          <i class="fa-solid fa-right-to-bracket me-2" id="loginIcon"></i>Ingresar
        </button>
      </form>
    </div>
    <div class="login-footer">© 2024 InventarioIT SaaS · Todos los derechos reservados</div>
  </div>

  <script>
    // Si ya tiene sesión válida, redirige directo
    const token = localStorage.getItem('accessToken');
    if (token) window.location.href = '/index.html';

    const form   = document.getElementById('loginForm');
    const alert  = document.getElementById('alertLogin');
    const msg    = document.getElementById('alertMsg');
    const btn    = document.getElementById('btnLogin');
    const spin   = document.getElementById('spinner');
    const icon   = document.getElementById('loginIcon');

    const showError = (text) => {
      msg.textContent = text;
      alert.classList.remove('d-none');
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alert.classList.add('d-none');
      btn.disabled = true;
      spin.style.display = 'inline-block';
      icon.classList.add('d-none');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) { showError(data.message || 'Error al iniciar sesión'); return; }

        localStorage.setItem('accessToken',  data.data.tokens.accessToken);
        localStorage.setItem('refreshToken', data.data.tokens.refreshToken);
        localStorage.setItem('usuario',      JSON.stringify(data.data.usuario));

        window.location.href = '/index.html';
      } catch {
        showError('No se pudo conectar con el servidor. Verifique su conexión.');
      } finally {
        btn.disabled = false;
        spin.style.display = 'none';
        icon.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
