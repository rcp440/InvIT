<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarioIT — Nueva contraseña</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { --brand: #1e3a5f; --brand-light: #2d5a8e; --accent: #0ea5e9; }
    body {
      background: linear-gradient(135deg, var(--brand) 0%, #0f2340 60%, #162d4a 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card-box {
      background: #fff; border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,.35);
      width: 100%; max-width: 420px; overflow: hidden;
    }
    .card-header-custom {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      padding: 2.5rem 2rem 2rem; text-align: center; color: #fff;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: rgba(255,255,255,.15); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; font-size: 1.8rem;
    }
    .card-header-custom h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .card-header-custom p  { font-size: .85rem; opacity: .75; margin: .25rem 0 0; }
    .card-body-custom { padding: 2rem; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(14,165,233,.2); }
    .btn-primary-custom {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      border: none; color: #fff; font-weight: 600;
      padding: .75rem; font-size: 1rem; transition: opacity .2s;
    }
    .btn-primary-custom:hover { opacity: .9; color: #fff; }
    .btn-primary-custom:disabled { opacity: .6; }
    .footer { text-align: center; padding: 1rem 2rem 1.5rem; color: #adb5bd; font-size: .78rem; }
  </style>
</head>
<body>
  <div class="card-box">
    <div class="card-header-custom">
      <div class="logo-icon"><i class="fa-solid fa-key"></i></div>
      <h1>Nueva contraseña</h1>
      <p>Ingresá tu nueva contraseña</p>
    </div>

    <div class="card-body-custom">
      <div id="alertMsg" class="d-none mb-3"></div>

      <!-- Formulario -->
      <div id="formSection">
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="pwd1" placeholder="Nueva contraseña" autocomplete="new-password">
          <label><i class="fa-solid fa-lock me-1"></i>Nueva contraseña</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="pwd2" placeholder="Repetir contraseña" autocomplete="new-password">
          <label><i class="fa-solid fa-lock me-1"></i>Repetir contraseña</label>
        </div>
        <button class="btn btn-primary-custom w-100 rounded-3" id="btnReset">
          <span id="spin" class="spinner-border spinner-border-sm me-2 d-none"></span>
          <i class="fa-solid fa-check me-1"></i>Guardar contraseña
        </button>
      </div>

      <!-- Éxito -->
      <div id="successSection" class="d-none text-center py-2">
        <i class="fa-solid fa-circle-check text-success" style="font-size:3rem"></i>
        <p class="mt-3 fw-semibold">¡Contraseña actualizada!</p>
        <a href="/login.html" class="btn btn-primary-custom rounded-3 w-100 mt-2">
          <i class="fa-solid fa-right-to-bracket me-1"></i>Ir al inicio de sesión
        </a>
      </div>

      <div class="text-center mt-3">
        <a href="/login.html" style="color:var(--accent);font-size:.85rem;text-decoration:none">
          <i class="fa-solid fa-arrow-left me-1"></i>Volver al inicio de sesión
        </a>
      </div>
    </div>
    <div class="footer">© 2024 InventarioIT SaaS · Todos los derechos reservados</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const alert  = document.getElementById('alertMsg');

    const showAlert = (msg, type = 'danger') => {
      alert.className = `alert alert-${type}`;
      alert.textContent = msg;
    };

    if (!token) {
      showAlert('Token inválido o expirado. Solicitá un nuevo enlace de recuperación.');
      document.getElementById('formSection').classList.add('d-none');
    }

    document.getElementById('btnReset').addEventListener('click', async () => {
      const pwd1 = document.getElementById('pwd1').value;
      const pwd2 = document.getElementById('pwd2').value;
      alert.className = 'd-none';

      if (!pwd1 || pwd1.length < 8) { showAlert('La contraseña debe tener al menos 8 caracteres.'); return; }
      if (pwd1 !== pwd2)            { showAlert('Las contraseñas no coinciden.'); return; }

      const btn  = document.getElementById('btnReset');
      const spin = document.getElementById('spin');
      btn.disabled = true; spin.classList.remove('d-none');

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pwd1 }),
        });
        const data = await res.json();
        if (!res.ok) { showAlert(data.message || 'Error al restablecer la contraseña.'); return; }
        document.getElementById('formSection').classList.add('d-none');
        document.getElementById('successSection').classList.remove('d-none');
      } catch {
        showAlert('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false; spin.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
